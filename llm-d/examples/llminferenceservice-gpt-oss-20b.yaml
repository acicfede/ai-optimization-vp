apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: gpt-oss-20b
  namespace: agent
  annotations:
    opendatahub.io/hardware-profile-name: gpu
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
spec:
  model:
    name: gpt-oss-20b
    uri: oci://registry.redhat.io/rhelai1/modelcar-gpt-oss-20b:1.5
  replicas: 1
  router:
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
    route: {}
    scheduler: {}
  template:
    containers:
      - name: main
        env:
          - name: VLLM_ADDITIONAL_ARGS
            value: "--enable-auto-tool-choice --tool-call-parser=openai --max_model_len=32768"
        resources:
          requests:
            cpu: "8"
            memory: 16Gi
            nvidia.com/gpu: "2"
          limits:
            cpu: "8"
            memory: 16Gi
            nvidia.com/gpu: "2"
    imagePullSecrets:
      - name: gpt-oss-20b
