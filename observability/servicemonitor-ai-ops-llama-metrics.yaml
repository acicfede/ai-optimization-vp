apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    monitoring.opendatahub.io/scrape: 'true'
  name: llama-metrics
  namespace: ai-ops
spec:
  endpoints:
  - path: /metrics
    port: llama-metrics
    scheme: http
  namespaceSelector: {}
  selector:
    matchLabels:
      name: llama-metrics
