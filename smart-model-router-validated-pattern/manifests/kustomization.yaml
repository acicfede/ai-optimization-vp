apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: smart-model-router

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml

configMapGenerator:
  - name: smart-router-settings
    envs:
      - router-config.env

generatorOptions:
  disableNameSuffixHash: true
